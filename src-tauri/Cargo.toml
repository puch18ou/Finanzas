[package]
name = "finanzas"
version = "0.1.22"
description = "Aplicacion personal de finanzas"
authors = ["you"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "finanzas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Quita los simbolos de debug del binario. Reduce MUCHISIMO el tamano del .so
# de Android (de ~200MB a ~30MB) sin afectar la funcionalidad, y hace la
# instalacion en el movil mucho mas rapida.
[profile.dev]
strip = true

[build-dependencies]
tauri-build = { version = "2.3", features = [] }

[dependencies]
tauri = { version = "2.10", features = [] }
tauri-plugin-sql = { version = "2.3", features = ["sqlite"] }
tauri-plugin-http = "2"
# Abrir URLs en el navegador del sistema (descarga del APK en el flujo de
# auto-update asistido de movil). Funciona en escritorio y movil.
tauri-plugin-opener = "2"
# Sistema de ficheros: copias de seguridad automaticas (.json.gz rotadas) en
# la carpeta de datos de la app. Funciona en escritorio y movil.
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Sync P2P (Fase 2, Lote I): mini-servidor HTTP en el PC (host) + IP local.
tiny_http = "0.12"
local-ip-address = "0.6"

# Auto-update: SOLO escritorio (el plugin updater de Tauri no soporta Android/
# iOS). En movil usamos un flujo asistido propio (aviso + descarga).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
