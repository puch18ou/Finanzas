[package]
name = "finanzas"
version = "0.1.0"
description = "Aplicacion personal de finanzas"
authors = ["you"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "finanzas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.3", features = [] }

[dependencies]
tauri = { version = "2.10", features = [] }
tauri-plugin-sql = { version = "2.3", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
