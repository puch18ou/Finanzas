name: Test Android build

# Workflow TEMPORAL para depurar el build de Android en CI sin re-publicar el
# escritorio ni gastar versiones. Se lanza a mano (workflow_dispatch) y sube el
# APK como artefacto. Cuando el build sea fiable, portamos los pasos a
# release.yml y borramos este fichero.

on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: android-actions/setup-android@v3
      - name: Instalar plataforma Android 36
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci
      - name: Firma (keystore.properties desde secrets)
        run: |
          cd src-tauri/gen/android
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" > keystore.properties
          echo "password=${{ secrets.ANDROID_KEY_PASSWORD }}" >> keystore.properties
          echo "${{ secrets.ANDROID_KEY_BASE64 }}" | base64 -d > "$RUNNER_TEMP/finanzas.jks"
          echo "storeFile=$RUNNER_TEMP/finanzas.jks" >> keystore.properties
      - name: Compilar APK de release (firmado)
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          echo "NDK_HOME=$NDK_HOME"
          npx tauri android build --apk --target aarch64
      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk
          if-no-files-found: error
