name: Release

# Publica una release firmada al subir un tag de version (vX.Y.Z):
#   - PC (job desktop): tauri-action compila, FIRMA y genera latest.json.
#   - Android (job android): compila el APK de release FIRMADO y lo adjunta.
#
# Secrets necesarios (repo -> Settings -> Secrets and variables -> Actions):
#   ESCRITORIO:
#     TAURI_SIGNING_PRIVATE_KEY           (contenido de ~/.tauri/finanzas-updater.key)
#     TAURI_SIGNING_PRIVATE_KEY_PASSWORD  (vacio)
#   ANDROID:
#     ANDROID_KEY_BASE64    (base64 del keystore ~/.tauri/finanzas-android.jks)
#     ANDROID_KEY_ALIAS     (upload)
#     ANDROID_KEY_PASSWORD  (la del keystore)
#
# Publicar:  subir "version" en tauri.conf.json + package.json + Cargo.toml,
#            commit, y:  git tag v0.1.3 && git push origin v0.1.3

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  desktop:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Finanzas ${{ github.ref_name }}"
          releaseBody: "Actualizacion automatica."
          releaseDraft: false
          prerelease: false

  android:
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Instalar plataforma Android 36
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci
      - name: Firma (keystore.properties desde secrets)
        run: |
          cd src-tauri/gen/android
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" > keystore.properties
          echo "password=${{ secrets.ANDROID_KEY_PASSWORD }}" >> keystore.properties
          echo "${{ secrets.ANDROID_KEY_BASE64 }}" | base64 -d > "$RUNNER_TEMP/finanzas.jks"
          echo "storeFile=$RUNNER_TEMP/finanzas.jks" >> keystore.properties
      - name: Compilar APK de release (firmado)
        env:
          NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: npx tauri android build --apk --target aarch64
      - name: Subir APK a la release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk "Finanzas-${{ github.ref_name }}.apk"
          gh release upload "${{ github.ref_name }}" "Finanzas-${{ github.ref_name }}.apk" --clobber
